# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: "skill://llm-kb/jsonschema/dialect.jsonschema.yaml"
description: Schema for design entries in 040-design.kb/
$ref: "skill://llm-design-kb/jsonschema/layer-entry.jsonschema.yaml#base"
required: [why]
properties:
  background:
    description: Background entries that inform this design
    type: array
    items:
      type: string
  source:
    description: Primary-source content paths (conversation transcripts, extracted docs) this design derives from
    type: array
    items:
      type: string
  last-updated:
    description: Required for summary docs at parent scope of a sub-kb
    type: date
unevaluatedProperties: false

[project]
name = "chatfs-cli"
version = "0.1.0"
description = "Lazy filesystem for chat conversations (claude.ai, ChatGPT)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-typed-json",
]

[project.optional-dependencies]
dev = [
    "basedpyright-as-pyright",
    "pytest",
    "pytest-pyright",
]

# One command per pipeline leaf, plus a bare-noun driver where a noun's
# stages compose into a single default: kebab name == module path, per
# design.kb/040-design.kb/cli-command-shape.md. The bare `chatfs` name is
# reserved for the future Rust dispatcher (package-division.md).
[project.scripts]
# Provider-dispatching forms: same noun/locator/verb, provider read off the
# locator itself (URL host, cache path segment) instead of typed.
chatfs-conversation-url-browse = "chatfs.conversation.url_browse:main"
chatfs-conversation-url-render = "chatfs.conversation.url_render:main"
chatfs-conversation-path-browse = "chatfs.conversation.path_browse:main"
chatfs-conversation-path-render = "chatfs.conversation.path_render:main"
chatfs-conversation-render = "chatfs.conversation.render:main"
chatfs-provider-claude-conversation-url-browse = "chatfs.provider.claude.conversation.url_browse:main"
chatfs-provider-claude-conversation-url-render = "chatfs.provider.claude.conversation.url_render:main"
chatfs-provider-claude-conversation-url-trash = "chatfs.provider.claude.conversation.url_trash:main"
chatfs-provider-claude-conversation-path-browse = "chatfs.provider.claude.conversation.path_browse:main"
chatfs-provider-claude-conversation-path-render = "chatfs.provider.claude.conversation.path_render:main"
chatfs-provider-claude-conversation-render = "chatfs.provider.claude.conversation.render:main"
chatfs-provider-claude-conversation-splat = "chatfs.provider.claude.conversation.splat:main"
chatfs-provider-claude-index = "chatfs.provider.claude.index.__main__:main"
chatfs-provider-claude-index-browse = "chatfs.provider.claude.index.browse:main"
chatfs-provider-claude-index-splat = "chatfs.provider.claude.index.splat:main"
chatfs-provider-chatgpt-conversation-url-browse = "chatfs.provider.chatgpt.conversation.url_browse:main"
chatfs-provider-chatgpt-conversation-url-render = "chatfs.provider.chatgpt.conversation.url_render:main"
chatfs-provider-chatgpt-conversation-path-browse = "chatfs.provider.chatgpt.conversation.path_browse:main"
chatfs-provider-chatgpt-conversation-path-render = "chatfs.provider.chatgpt.conversation.path_render:main"
chatfs-provider-chatgpt-conversation-render = "chatfs.provider.chatgpt.conversation.render:main"
chatfs-provider-chatgpt-conversation-splat = "chatfs.provider.chatgpt.conversation.splat:main"
chatfs-provider-chatgpt-conversation-assemble = "chatfs.provider.chatgpt.conversation.assemble:main"
chatfs-provider-chatgpt-index = "chatfs.provider.chatgpt.index.__main__:main"
chatfs-provider-chatgpt-index-browse = "chatfs.provider.chatgpt.index.browse:main"
chatfs-provider-chatgpt-index-splat = "chatfs.provider.chatgpt.index.splat:main"
chatfs-provider-aistudio-conversation-url-browse = "chatfs.provider.aistudio.conversation.url_browse:main"
chatfs-provider-aistudio-conversation-url-render = "chatfs.provider.aistudio.conversation.url_render:main"
chatfs-provider-aistudio-conversation-path-browse = "chatfs.provider.aistudio.conversation.path_browse:main"
chatfs-provider-aistudio-conversation-path-render = "chatfs.provider.aistudio.conversation.path_render:main"
chatfs-provider-aistudio-conversation-render = "chatfs.provider.aistudio.conversation.render:main"
chatfs-provider-aistudio-conversation-splat = "chatfs.provider.aistudio.conversation.splat:main"
chatfs-provider-aistudio-conversation-massage-json = "chatfs.provider.aistudio.conversation.massage_json:main"
chatfs-provider-aistudio-index = "chatfs.provider.aistudio.index.__main__:main"
chatfs-provider-aistudio-index-browse = "chatfs.provider.aistudio.index.browse:main"
chatfs-provider-aistudio-index-splat = "chatfs.provider.aistudio.index.splat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/chatfs"]

[tool.pytest.ini_options]
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]

[tool.uv.sources]
basedpyright-as-pyright = { git = "https://github.com/bukzor/basedpyright-as-pyright" }

# Scoped to direct invocations rooted at this package (e.g. the
# typesafety/ pyrightconfig.json's `extends`); the repo-root
# `basedpyright .` sweep resolves its own [tool.pyright] instead and
# never reads this one.
[tool.pyright]
typeCheckingMode = "strict"
analyzeUnannotatedFunctions = true
reportIncompatibleMethodOverride = "error"
pythonVersion = "3.13"
enableTypeIgnoreComments = true
reportPrivateUsage = "warning"
reportConstantRedefinition = "error"
reportIncompatibleVariableOverride = "error"
reportMissingImports = "error"
reportMissingTypeStubs = false
exclude = [".venv", "__pycache__", "typesafety"]

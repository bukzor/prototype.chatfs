[project]
name = "chatfs-cli"
version = "0.1.0"
description = "Lazy filesystem for chat conversations (claude.ai, ChatGPT)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bukzor.chatgpt-export",
]

[dependency-groups]
dev = ["bukzor.chatgpt-export[dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/chatfs"]

[tool.pytest.ini_options]
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]

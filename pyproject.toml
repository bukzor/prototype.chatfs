[project]
name = "chatfs-workspace"
version = "0"
description = "Top-level workspace for chatfs development; depends on chatfs for default install"
requires-python = ">=3.12"
dependencies = ["chatfs-cli"]

[dependency-groups]
dev = [
    "bukzor-chatgpt-export[dev]",
    "chatfs-cli[dev]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/chatfs-fuser", "packages/har-browse"]

[tool.uv.sources]
chatfs-cli = { workspace = true }
bukzor-chatgpt-export = { workspace = true }

[tool.pyright]
# Vendored third-party code is excluded by name; our own exploration
# scripts under docs/ stay checked.
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv",
  "**/trash",
  "**/typesafety",
  "docs/dev/reference-implementations",
]

# rosetta/ scripts import their sibling convert.py by bare name (they run
# with rosetta/ as cwd); put it on the resolution path so the root check
# agrees.
[[tool.pyright.executionEnvironments]]
root = "docs/dev/aistudio-schema/rosetta"
extraPaths = ["docs/dev/aistudio-schema/rosetta"]

[tool.pytest.ini_options]
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]
# pytest defaults, plus trash/ (scratch; pyright excludes it above too)
norecursedirs = ["*.egg", ".*", "build", "dist", "node_modules", "venv", "trash"]

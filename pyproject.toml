[project]
name = "chatfs-workspace"
version = "0"
description = "Top-level workspace for chatfs development; depends on chatfs for default install"
requires-python = ">=3.12"
dependencies = ["chatfs-cli"]

[dependency-groups]
dev = [
    "bukzor-chatgpt-export[dev]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/chatfs-fuser", "packages/har-browse"]

[tool.uv.sources]
chatfs-cli = { workspace = true }
bukzor-chatgpt-export = { workspace = true }

[tool.pyright]
# docs/ holds vendored reference implementations and one-off exploration
# scripts, not product code -- that graduates to packages/* and is checked
# there (child-001: clean from repo root, no per-incubator scoping).
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv",
  "**/trash",
  "**/typesafety",
  "**/docs",
]

[tool.pytest.ini_options]
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]
# pytest defaults, plus trash/ (scratch; pyright excludes it above too)
norecursedirs = ["*.egg", ".*", "build", "dist", "node_modules", "venv", "trash"]
